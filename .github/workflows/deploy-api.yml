name: Deploy API to Cloudflare Containers

on:
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "lib/db/**"
      - "lib/api-zod/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    # Dormente até a migração para a Cloudflare ser de fato ligada. Sem isso o
    # workflow dispararia em todo push que toque estes caminhos e falharia por
    # falta de CLOUDFLARE_API_TOKEN, deixando um X vermelho no main que parece
    # deploy quebrado — mas o site é publicado pelo Railway, não por aqui.
    #
    # Para ligar: crie a variável de repositório CLOUDFLARE_DEPLOY_ENABLED com
    # o valor "true" (Settings > Secrets and variables > Actions > Variables),
    # depois de configurar os secrets. Ver docs/migracao-cloudflare.md.
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy container + Worker
        working-directory: artifacts/api-server
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
